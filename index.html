    function calculateFinalPrice(originalPrice, discountPercent) {
      const price = Math.max(0, Number(originalPrice) || 0);
      const discount = Math.min(100, Math.max(0, Number(discountPercent) || 0));
      if (discount > 0) {
        return Math.round((price * (1 - discount / 100)) * 100) / 100;
      }
      return Math.round(price * 100) / 100;
    }

    // Generador de enlace de WhatsApp con formato exacto:
    // "Hola, quiero pedir este producto: [Nombre del producto], Precio: [Precio]"
    function formatWhatsappUrl(phone, productName, priceText) {
      const cleanPhone = (phone || '').replace(/[^0-9]/g, '');
      const message = `Hola, quiero pedir este producto: ${productName}, Precio: ${priceText}`;
      const encoded = encodeURIComponent(message);
      if (cleanPhone) {
        return `https://wa.me/${cleanPhone}?text=${encoded}`;
      }
      return `https://api.whatsapp.com/send?text=${encoded}`;
    }

      loadSession() {
        const email = localStorage.getItem(SESSION_KEY);
        if (email) {
          const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
          const user = users[email.toLowerCase()];
          if (user) {
            if (user.email.toLowerCase() === VIP_EMAIL.toLowerCase()) {
              user.subscriptionStatus = 'active';
              user.isVipExempt = true;
            }
            this.currentUser = user;
          }
        }
      }

      handleUrlRouting() {
        const params = new URLSearchParams(window.location.search);
        const storeId = params.get('store');
        if (storeId) {
          const stores = JSON.parse(localStorage.getItem(STORES_KEY) || '{}');
          if (stores[storeId]) {
            this.activeStore = stores[storeId];
            this.currentView = 'public';
            return;
          }
        }

        if (this.currentUser) {
          if (this.currentUser.subscriptionStatus === 'pending_payment' && !this.currentUser.isVipExempt) {
            this.currentView = 'paywall';
          } else {
            const stores = JSON.parse(localStorage.getItem(STORES_KEY) || '{}');
            this.activeStore = stores[this.currentUser.storeId];
            this.currentView = 'admin';
          }
        } else {
          this.currentView = 'home';
        }
      }

          ownerLinks.classList.remove('hidden');
          ownerLinks.classList.add('flex');
          const isVip = this.currentUser.email.toLowerCase() === VIP_EMAIL.toLowerCase();

                </span>
                <span class="text-xs text-slate-500 truncate max-w-[150px]">${this.currentUser.email}</span>
              </div>
              <button onclick="app.logout()" title="Cerrar sesión" class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg border border-slate-200">

              </button>
            </div>
          `;
        } else {
          ownerLinks.classList.add('hidden');
          ownerLinks.classList.remove('flex');
          container.innerHTML = `
            <button onclick="app.openAuthModal('login')" class="px-3.5 py-1.5 text-xs font-medium text-slate-700 hover:text-slate-900 hover:bg-slate-100 rounded-lg">
              Iniciar Sesión

            <button onclick="app.openAuthModal('register')" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm">
              Crear Mi Tienda ($30/mes)
            </button>
          `;
        }
        if (window.lucide) lucide.createIcons();
      }

      render() {
        const root = document.getElementById('app-root');
        this.renderNavbar();

        if (this.currentView === 'paywall') {
          root.innerHTML = this.renderPaywallView();
        } else if (this.currentView === 'admin' && this.currentUser && this.activeStore) {
          root.innerHTML = this.renderAdminView();
        } else if (this.currentView === 'public' && this.activeStore) {
          root.innerHTML = this.renderPublicView();
        } else {
          root.innerHTML = this.renderHomeView();
        }
        if (window.lucide) lucide.createIcons();
      }

                    </button>
                    ${store.whatsapp ? `
                      <a href="https://wa.me/${store.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg flex items-center gap-2">
                        <i data-lucide="message-circle" class="w-4 h-4"></i>
                        <span>Contactar Tienda</span>
                      </a>
                    ` : ''}
                  </div>
                </div>
              </div>
            </section>

            <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                ${products.map(p => {
                  const isOutOfStock = p.stock <= 0;
                  const hasDiscount = (p.discountPercent || 0) > 0;
                  const priceText = `$${p.finalPrice.toFixed(2)} ${store.currency || '$ USD'}`;
                  const orderUrl = formatWhatsappUrl(store.whatsapp, p.name, priceText);

                  return `
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-lg transition-all ${isOutOfStock ? 'opacity-80' : ''}">
                      <div>
                        <div class="relative aspect-4/3 bg-slate-100 overflow-hidden">
                          <img src="${p.imageUrl}" alt="${p.name}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80'">
                          <div class="absolute top-2.5 left-2.5 flex flex-col gap-1 items-start">
                            ${isOutOfStock ? `
                              <span class="px-2.5 py-1 text-xs font-extrabold bg-red-600 text-white rounded-md shadow-md">¡AGOTADO! (0 en stock)</span>
                            ` : `
                              <span class="px-2 py-0.5 text-[11px] font-medium bg-emerald-600 text-white rounded-md shadow-sm">${p.stock} en stock</span>
                            `}
                            ${hasDiscount ? `
                              <span class="px-2 py-0.5 text-[11px] font-bold bg-blue-600 text-white rounded-md shadow-sm">-${p.discountPercent}% OFF</span>
                            ` : ''}
                          </div>
                        </div>
                        <div class="p-5">
                          <p class="text-[11px] font-semibold uppercase text-slate-400 mb-1">${p.category}</p>
                          <h3 class="text-base font-bold text-slate-900 line-clamp-1">${p.name}</h3>
                          <p class="text-xs text-slate-600 line-clamp-2 mt-1.5">${p.description}</p>
                        </div>
                      </div>

                      <div class="p-5 pt-0">
                        <div class="pt-3 border-t border-slate-100 mb-4 flex items-baseline justify-between">
                          <div>
                            ${hasDiscount ? `
                              <span class="text-xs text-slate-400 line-through tabular-nums">$${p.originalPrice.toFixed(2)}</span>
                            ` : ''}
                            <span class="text-xl font-extrabold text-slate-900 tabular-nums">$${p.finalPrice.toFixed(2)} <span class="text-xs font-normal text-slate-500">${store.currency || '$ USD'}</span></span>
                          </div>
                        </div>

                        ${isOutOfStock ? `
                          <button disabled class="w-full py-2.5 px-3 bg-slate-100 text-slate-400 font-semibold rounded-xl text-xs flex items-center justify-center gap-2 cursor-not-allowed">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i>
                            <span>Agotado temporalmente</span>
                          </button>
                        ` : `
                          <a href="${orderUrl}" target="_blank" rel="noopener noreferrer" class="w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-sm transition-all flex items-center justify-center gap-2">
                            <i data-lucide="message-circle" class="w-4 h-4"></i>
                            <span>Pedir por WhatsApp</span>
                          </a>
                        `}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </main>
          </div>
        `;
      }

      renderAdminView() {
        const store = this.activeStore;
        const products = JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]').filter(p => p.storeId === store.id);
        const storeUrl = `${window.location.origin}${window.location.pathname}?store=${store.id}`;

        return `
          <div class="min-h-screen bg-slate-50 pb-16">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-6">
              <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 pb-4 border-b border-slate-100">
                  <div>
                    <h1 class="text-2xl font-bold text-slate-900">${store.name}</h1>
                    <p class="text-xs text-slate-500">Panel de Administración de tu Tienda</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="app.viewMyPublicCatalog()" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg flex items-center gap-1.5">
                      <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                      <span>Ver Catálogo Público</span>
                    </button>
                  </div>
                </div>

                <!-- Campo Obligatorio de Teléfono de WhatsApp -->
                <div class="p-4 sm:p-5 bg-emerald-50 rounded-xl border border-emerald-200">
                  <form onsubmit="app.saveWhatsapp(event)" class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <div class="flex items-center gap-2">
                        <i data-lucide="phone" class="w-4 h-4 text-emerald-700"></i>
                        <span class="text-xs font-bold uppercase text-emerald-950">Número de Teléfono de WhatsApp (con código de país) *</span>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-200 text-emerald-800">Requerido</span>
                      </div>
                      <p class="text-xs text-emerald-800 mt-0.5">Cada botón 'Pedir por WhatsApp' abrirá una conversación a este número con el pedido prellenado.</p>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <input type="tel" id="admin-whatsapp-input" required value="${store.whatsapp || ''}" placeholder="Ej. +52 1 55 1234 5678" class="w-60 px-3 py-1.5 text-xs bg-white border border-emerald-300 rounded-lg font-mono focus:ring-2 focus:ring-emerald-500">
                      <button type="submit" class="px-4 py-1.5 text-xs font-bold text-white bg-emerald-700 hover:bg-emerald-800 rounded-lg">Guardar Teléfono</button>
                    </div>
                  </form>
                </div>

                <!-- Enlace Único de la Tienda -->
                <div class="p-4 bg-blue-50 rounded-xl border border-blue-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <span class="text-xs font-bold text-blue-900 uppercase">Enlace Único y Exclusivo de tu Tienda:</span>
                    <p class="text-xs text-blue-950 font-mono break-all mt-1 bg-white px-3 py-1.5 rounded-lg border border-blue-200">${storeUrl}</p>
                  </div>
                  <button onclick="app.copyStoreLink()" class="px-4 py-2 text-xs font-bold bg-white text-blue-700 border border-blue-300 rounded-lg hover:bg-slate-50 shrink-0">
                    Copiar Enlace
                  </button>
                </div>

                <!-- Gestión de Productos -->
                <div class="pt-4 flex items-center justify-between">
                  <h2 class="text-lg font-bold text-slate-900">Productos (${products.length})</h2>
                  <button onclick="app.openNewProductPrompt()" class="px-4 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Añadir Producto</span>
                  </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  ${products.map(p => {
                    const priceText = `$${p.finalPrice.toFixed(2)} ${store.currency || '$ USD'}`;
                    const whatsappUrl = formatWhatsappUrl(store.whatsapp, p.name, priceText);
                    return `
                      <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-col justify-between">
                        <div class="flex gap-3">
                          <img src="${p.imageUrl}" alt="${p.name}" class="w-14 h-14 rounded-lg object-cover bg-white" onerror="this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80'">
                          <div>
                            <span class="text-[10px] text-slate-500 uppercase font-semibold">${p.category}</span>
                            <h4 class="text-sm font-bold text-slate-900 line-clamp-1">${p.name}</h4>
                            <p class="text-xs font-mono font-bold text-slate-800">$${p.finalPrice.toFixed(2)} <span class="font-normal text-slate-500">(Stock: ${p.stock})</span></p>
                          </div>
                        </div>
                        <div class="mt-3 pt-3 border-t border-slate-200 flex items-center justify-between gap-2">
                          <a href="${whatsappUrl}" target="_blank" class="text-[11px] text-emerald-700 font-semibold flex items-center gap-1 hover:underline">
                            <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> Probar WhatsApp
                          </a>
                          <button onclick="app.deleteProduct('${p.id}')" class="text-xs text-red-600 hover:underline">Eliminar</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      renderPaywallView() {
        return `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md">
            <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-8 border border-slate-100 text-center space-y-6">
              <span class="px-3 py-1 rounded-full bg-blue-100 text-blue-700 font-bold text-xs uppercase">Suscripción Requerida</span>
              <h2 class="text-2xl font-bold text-slate-900">Desbloquea tu Tienda y Catálogo Exclusivo</h2>
              <p class="text-xs sm:text-sm text-slate-600 max-w-md mx-auto">
                Para cualquier tienda (ropa, comida, celulares, tecnología). Activa tu membresía de <strong>$30 USD / mes</strong> vía PayPal para recibir pedidos por WhatsApp.
              </p>
              <a href="${PAYPAL_SUBSCRIPTION_URL}" target="_blank" rel="noopener noreferrer" class="w-full py-3.5 px-4 bg-[#0070ba] hover:bg-[#005ea6] text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2 text-sm">
                <span>Suscribirse con PayPal ($30 USD)</span>
                <i data-lucide="external-link" class="w-4 h-4"></i>
              </a>
              <button onclick="app.confirmPaymentSimulated()" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs">
                Ya completé el pago, Desbloquear mi Tienda
              </button>
            </div>
          </div>
        `;
      }

      openAuthModal(mode = 'login') {
        this.setAuthMode(mode);
        document.getElementById('auth-modal').classList.remove('hidden');
        document.getElementById('auth-modal').classList.add('flex');
        if (window.lucide) lucide.createIcons();
      }

      closeAuthModal() {
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('auth-modal').classList.remove('flex');
      }

      setAuthMode(mode) {
        this.authMode = mode;
        const regFields = document.getElementById('register-fields');
        const title = document.getElementById('auth-modal-title');
        const desc = document.getElementById('auth-modal-desc');
        const tabLogin = document.getElementById('auth-tab-login');
        const tabReg = document.getElementById('auth-tab-register');
        const submitBtn = document.getElementById('auth-submit-btn');

        if (mode === 'register') {
          regFields.classList.remove('hidden');
          title.textContent = 'Crea tu catálogo exclusivo';
          desc.textContent = 'Para ropa, tecnología, comida, celulares o cualquier negocio';
          tabReg.className = 'flex-1 py-1.5 text-xs font-semibold rounded-md bg-white text-slate-900 shadow-sm';
          tabLogin.className = 'flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900';
          submitBtn.innerHTML = '<span>Crear Mi Tienda y Continuar</span>';
        } else {
          regFields.classList.add('hidden');
          title.textContent = 'Iniciar Sesión';
          desc.textContent = 'Accede a tu panel para gestionar tus productos';
          tabLogin.className = 'flex-1 py-1.5 text-xs font-semibold rounded-md bg-white text-slate-900 shadow-sm';
          tabReg.className = 'flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900';
          submitBtn.innerHTML = '<span>Entrar al Panel</span>';
        }
      }

      handleAuthSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const errorBox = document.getElementById('auth-error-box');
        errorBox.classList.add('hidden');

        if (this.authMode === 'register') {
          const storeName = document.getElementById('auth-store-name').value.trim() || 'Mi Tienda Exclusiva';
          const whatsapp = document.getElementById('auth-whatsapp').value.trim();

          if (!whatsapp || whatsapp.replace(/[^0-9]/g, '').length < 8) {
            errorBox.textContent = 'Por favor ingresa un número de WhatsApp válido con código de país.';
            errorBox.classList.remove('hidden');
            return;
          }

          const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
          if (users[email.toLowerCase()]) {
            errorBox.textContent = 'Este correo ya tiene cuenta. Inicia sesión.';
            errorBox.classList.remove('hidden');
            return;
          }

          const isVip = email.toLowerCase() === VIP_EMAIL.toLowerCase();
          const storeSlug = 'tienda-' + Date.now().toString().slice(-4);
          const newUser = {
            id: 'usr_' + Date.now(),
            email,
            password,
            subscriptionStatus: isVip ? 'active' : 'pending_payment',
            isVipExempt: isVip,
            storeId: storeSlug,
          };
          users[email.toLowerCase()] = newUser;
          localStorage.setItem(USERS_KEY, JSON.stringify(users));

          const stores = JSON.parse(localStorage.getItem(STORES_KEY) || '{}');
          stores[storeSlug] = {
            id: storeSlug,
            ownerEmail: email,
            name: storeName,
            description: `Catálogo oficial de ${storeName}. Haz tus pedidos directos a nuestro WhatsApp.`,
            whatsapp,
            currency: '$ USD',
          };
          localStorage.setItem(STORES_KEY, JSON.stringify(stores));

          localStorage.setItem(SESSION_KEY, email);
          this.currentUser = newUser;
          this.activeStore = stores[storeSlug];
          this.closeAuthModal();
          this.handleUrlRouting();
          this.render();
        } else {
          const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
          const isVip = email.toLowerCase() === VIP_EMAIL.toLowerCase();

          if (!users[email.toLowerCase()]) {
            if (isVip) {
              const vipUser = {
                id: 'usr_vip',
                email: VIP_EMAIL,
                password,
                subscriptionStatus: 'active',
                isVipExempt: true,
                storeId: 'nova-store',
              };
              users[email.toLowerCase()] = vipUser;
              localStorage.setItem(USERS_KEY, JSON.stringify(users));
            } else {
              errorBox.textContent = 'No se encontró cuenta con este correo.';
              errorBox.classList.remove('hidden');
              return;
            }
          }

          const user = users[email.toLowerCase()];
          if (isVip) {
            user.subscriptionStatus = 'active';
            user.isVipExempt = true;
          }

          localStorage.setItem(SESSION_KEY, email);
          this.currentUser = user;
          const stores = JSON.parse(localStorage.getItem(STORES_KEY) || '{}');
          this.activeStore = stores[user.storeId];
          this.closeAuthModal();
          this.handleUrlRouting();
          this.render();
        }
      }

      quickLogin(targetEmail) {
        document.getElementById('auth-email').value = targetEmail;
        document.getElementById('auth-password').value = '123456';
        this.setAuthMode('login');
        document.getElementById('auth-form').dispatchEvent(new Event('submit'));
      }

      logout() {
        localStorage.removeItem(SESSION_KEY);
        this.currentUser = null;
        this.activeStore = null;
        this.currentView = 'home';
        window.history.pushState(null, '', window.location.pathname);
        this.render();
      }

      saveWhatsapp(e) {
        e.preventDefault();
        const input = document.getElementById('admin-whatsapp-input');
        const phone = input.value.trim();
        if (this.activeStore) {
          this.activeStore.whatsapp = phone;
          const stores = JSON.parse(localStorage.getItem(STORES_KEY) || '{}');
          stores[this.activeStore.id] = this.activeStore;
          localStorage.setItem(STORES_KEY, JSON.stringify(stores));
          alert('¡Número de WhatsApp guardado exitosamente!');
          this.render();
        }
      }

      confirmPaymentSimulated() {
        if (this.currentUser) {
          const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
          this.currentUser.subscriptionStatus = 'active';
          users[this.currentUser.email.toLowerCase()] = this.currentUser;
          localStorage.setItem(USERS_KEY, JSON.stringify(users));
          this.currentView = 'admin';
          this.render();
        }
      }

      copyStoreLink() {
        const url = `${window.location.origin}${window.location.pathname}?store=${this.activeStore.id}`;
        navigator.clipboard.writeText(url);
        alert('¡Enlace copiado al portapapeles!');
      }

      viewMyPublicCatalog() {
        if (this.currentUser) {
          window.location.search = `?store=${this.currentUser.storeId}`;
        }
      }

      viewDemoStore() {
        window.location.search = '?store=nova-store';
      }

      navigateHome() {
        window.location.search = '';
      }

      openNewProductPrompt() {
        const name = prompt('Nombre del producto (ej. Smartphone 128GB, Vestido Elegante, Combo Hamburguesa):');
        if (!name) return;
        const price = parseFloat(prompt('Precio original ($):', '50')) || 50;
        const stock = parseInt(prompt('Stock disponible:', '10'), 10) || 0;
        const discount = parseInt(prompt('Porcentaje de descuento opcional (0 a 90):', '0'), 10) || 0;

        const products = JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]');
        const newProd = {
          id: 'p_' + Date.now(),
          storeId: this.activeStore.id,
          name,
          description: 'Producto disponible para pedidos directos.',
          imageUrl: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80',
          category: 'General',
          originalPrice: price,
          discountPercent: discount,
          finalPrice: calculateFinalPrice(price, discount),
          stock,
        };
        products.unshift(newProd);
        localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
        this.render();
      }

      deleteProduct(id) {
        if (confirm('¿Deseas eliminar este producto de tu catálogo?')) {
          let products = JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]');
          products = products.filter(p => p.id !== id);
          localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
          this.render();
        }
      }
    }

    const app = new CatalogApp();
  </script>
</body>
</html>
