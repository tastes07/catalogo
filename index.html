<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Catálogos Online - Tiendas Digitales</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Cat%C3%A1logo%20Digital%22%2C%22short_name%22%3A%22Cat%C3%A1logo%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%234f46e5%22%2C%22icons%22%3A%5B%5D%7D">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- CONTENEDOR PRINCIPAL DE LA APLICACIÓN -->
    <div id="app" class="flex-grow flex flex-col"></div>

    <!-- MODAL DE DETALLES DE PRODUCTO (VISTA PÚBLICA) -->
    <div id="product-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 relative shadow-2xl">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-2xl font-bold">×</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- SCRIPT CENTRAL DE FUNCIONALIDAD -->
    <script>
        // CONFIGURACIÓN DE CORREO SUPREMO Y PAYPAL
        const ADMIN_VIP_EMAIL = "tastess07@gmail.com";
        const PAYPAL_SUBSCRIPTION_LINK = "https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-5M364683CW0430404NLTVTNQ";

        // GESTIÓN DE BASE DE DATOS LOCAL
        function getDB() {
            return JSON.parse(localStorage.getItem('saas_catalog_db')) || { stores: [], products: [], subscriptions: {} };
        }

        function saveDB(db) {
            localStorage.setItem('saas_catalog_db', JSON.stringify(db));
        }

        function getSession() {
            return JSON.parse(localStorage.getItem('saas_current_user')) || null;
        }

        function setSession(user) {
            localStorage.setItem('saas_current_user', JSON.stringify(user));
        }

        // ENRUTADOR PRINCIPAL
        function router() {
            const params = new URLSearchParams(window.location.search);
            const storeParam = params.get('store');
            const app = document.getElementById('app');

            if (storeParam) {
                renderPublicStore(storeParam, app);
            } else {
                renderAuthOrDashboard(app);
            }
        }

        // --- 1. VISTA PÚBLICA DEL CATÁLOGO (TIPO SHOPIFY / FRAME) ---
        function renderPublicStore(storeName, container) {
            const db = getDB();
            const store = db.stores.find(s => s.name.toLowerCase() === storeName.toLowerCase() || s.slug === storeName);

            if (!store) {
                container.innerHTML = `
                    <div class="flex-grow flex items-center justify-center p-6 text-center">
                        <div class="bg-white p-8 rounded-2xl shadow-md max-w-md w-full border border-slate-200">
                            <h2 class="text-2xl font-bold text-red-600 mb-2">Tienda no encontrada</h2>
                            <p class="text-slate-600 mb-6">El catálogo "<strong>${storeName}</strong>" no existe o fue eliminado.</p>
                            <a href="?" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-indigo-700 transition inline-block">Crear mi propia tienda</a>
                        </div>
                    </div>
                `;
                return;
            }

            const products = db.products.filter(p => p.storeId === store.id);

            container.innerHTML = `
                <!-- Cabecera de la Tienda -->
                <header class="bg-white border-b border-slate-200 py-6 px-4 shadow-sm">
                    <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 class="text-3xl font-extrabold text-slate-900">${store.name}</h1>
                            <p class="text-slate-600 mt-1">${store.description || 'Catálogo digital oficial'}</p>
                        </div>
                        <div class="w-full md:w-72">
                            <input type="text" id="search-input" oninput="filterProducts('${store.id}')" placeholder="Buscar productos..." class="w-full px-4 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        </div>
                    </div>
                </header>

                <!-- Cuadrícula de Productos -->
                <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6">
                    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        ${products.length === 0 ? '<p class="col-span-full text-center text-slate-500 py-12">Esta tienda aún no tiene productos agregados.</p>' : ''}
                        ${products.map(p => `
                            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                                <div class="h-48 bg-slate-100 overflow-hidden cursor-pointer relative" onclick="openProductModal('${p.id}')">
                                    <img src="${p.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'}" alt="${p.name}" class="w-full h-full object-cover">
                                    ${p.discount ? `<span class="absolute top-3 right-3 bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full">${p.discount}% OFF</span>` : ''}
                                </div>
                                <div class="p-4 flex flex-col flex-grow">
                                    <h3 class="font-bold text-lg text-slate-900 cursor-pointer hover:text-indigo-600" onclick="openProductModal('${p.id}')">${p.name}</h3>
                                    <p class="text-slate-600 text-sm mt-1 line-clamp-2 flex-grow">${p.description || 'Sin descripción'}</p>
                                    <div class="mt-4 flex items-center justify-between">
                                        <div>
                                            <span class="text-xl font-extrabold text-indigo-600">RD$ ${p.price}</span>
                                            ${p.stock ? `<span class="block text-xs text-slate-500">Stock: ${p.stock} unidades</span>` : ''}
                                        </div>
                                    </div>
                                    <a href="https://wa.me/${store.whatsapp}?text=Hola,%20estoy%20interesado%20en%20el%20producto:%20*${encodeURIComponent(p.name)}*%20(Precio:%20RD$%20${p.price})" target="_blank" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-center py-2.5 rounded-xl font-medium text-sm transition flex items-center justify-center gap-2">
                                        Pedir por WhatsApp
                                    </a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </main>

                <!-- Pie limpio de la tienda -->
                <footer class="bg-white border-t border-slate-200 py-6 px-4 text-center text-xs text-slate-400 mt-auto">
                    Catálogo impulsado por SaaS Tiendas Online. Sin comisiones por venta.
                </footer>
            `;
        }

        // --- 2. AUTENTICACIÓN Y PANEL DE CONTROL DE SUSCRIPCIÓN ---
        function renderAuthOrDashboard(container) {
            const user = getSession();
            const db = getDB();

            if (!user) {
                // Pantalla de Inicio de Sesión / Registro inicial
                container.innerHTML = `
                    <!-- Nota de capacidad y aviso de PayPal para administradores -->
                    <div class="bg-indigo-600 text-white px-4 py-3 text-xs md:text-sm relative shadow-md">
                        <div class="max-w-4xl mx-auto flex justify-between items-start gap-4 pr-8">
                            <div>
                                <p class="font-semibold mb-1">📢 Aviso importante del sistema:</p>
                                <p>Esta app no está diseñada para millones de usuarios, sino para una cantidad cierta. En el momento en el que la app no te deje acceder o iniciar sesión es porque se ha saturado. Si tienes alguna duda, confusión o problemas, siéntete libre de escribirme a <strong class="underline">${ADMIN_VIP_EMAIL}</strong> mediante el buzón de sugerencias.</p>
                                <p class="mt-2 font-semibold">💳 Pagos exclusivos por PayPal:</p>
                                <p>Lamentablemente la plataforma solo acepta pagos y suscripciones a través de PayPal ($30/mes). Necesitas una cuenta de PayPal con tarjeta de crédito o débito asociada para suscribirte.</p>
                            </div>
                            <button onclick="this.parentElement.parentElement.style.display='none'" class="text-white font-bold text-lg bg-indigo-700 hover:bg-indigo-800 px-2.5 py-1 rounded-full transition">×</button>
                        </div>
                    </div>

                    <div class="flex-grow flex items-center justify-center p-4">
                        <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full border border-slate-200">
                            <div class="text-center mb-6">
                                <h2 class="text-2xl font-extrabold text-slate-900">Acceso a Tu Tienda</h2>
                                <p class="text-sm text-slate-600 mt-1">Inicia sesión con tu correo para administrar tu catálogo</p>
                            </div>
                            <form onsubmit="handleAuth(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Correo Electrónico</label>
                                    <input type="email" id="auth-email" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                                </div>
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm">Continuar al Panel</button>
                            </form>
                        </div>
                    </div>

                    <!-- Buzón de sugerencias general -->
                    <footer class="bg-white border-t border-slate-200 py-8 px-4">
                        <div class="max-w-xl mx-auto text-center">
                            <h3 class="font-bold text-lg text-slate-800 mb-2">Buzón de Sugerencias y Soporte</h3>
                            <p class="text-sm text-slate-600 mb-4">¿Tienes dudas o necesitas ayuda? Escríbenos directamente.</p>
                            <form onsubmit="sendAdminSuggestion(event)" class="space-y-3">
                                <input type="text" id="sug-name" placeholder="Tu nombre" required class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm">
                                <textarea id="sug-msg" placeholder="Escribe tu mensaje aquí..." required class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm h-24"></textarea>
                                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-xl text-sm transition">Enviar al correo del admin</button>
                            </form>
                        </div>
                    </footer>
                `;
            } else {
                // Verificar si el usuario es VIP o pagó su suscripción en PayPal
                const isVip = user.email.toLowerCase() === ADMIN_VIP_EMAIL.toLowerCase();
                const hasPaid = db.subscriptions[user.email] === true;

                if (!isVip && !hasPaid) {
                    // Pantalla de pago obligatorio por PayPal ($30/mes)
                    container.innerHTML = `
                        <div class="flex-grow flex items-center justify-center p-4">
                            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full border border-indigo-100 text-center">
                                <span class="bg-amber-100 text-amber-800 text-xs px-3 py-1 rounded-full font-bold uppercase">Suscripción Requerida ($30/mes)</span>
                                <h2 class="text-2xl font-extrabold text-slate-900 mt-4">Activa tu Cuenta</h2>
                                <p class="text-sm text-slate-600 mt-2 mb-6">Para crear y mantener tu tienda online activa con enlace único y fotos ilimitadas, debes completar tu suscripción mensual de <strong>$30 USD</strong> a través de PayPal.</p>
                                
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 text-left text-xs text-slate-600 space-y-2">
                                    <p>📌 <strong>Nota:</strong> Solo aceptamos pagos seguros mediante PayPal (tarjeta de crédito o débito conectada a tu cuenta de PayPal).</p>
                                    <p>✉️ Usuario actual: <strong>${user.email}</strong></p>
                                </div>

                                <div class="space-y-3">
                                    <a href="${PAYPAL_SUBSCRIPTION_LINK}" target="_blank" onclick="simulatePayPalSuccess()" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-md">
                                        Suscribirse con PayPal ($30/mes)
                                    </a>
                                    <button onclick="confirmPaymentManual()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl text-sm transition">
                                        Ya realicé mi pago en PayPal, entrar a mi tienda
                                    </button>
                                    <button onclick="logout()" class="w-full text-slate-500 hover:text-slate-800 text-sm py-2">Cerrar sesión</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    renderDashboardContent(container, user);
                }
            }
        }

        // --- 3. PANEL DE GESTIÓN DE TIENDA Y PRODUCTOS ---
        function renderDashboardContent(container, user) {
            const db = getDB();
            let store = db.stores.find(s => s.ownerEmail === user.email);

            container.innerHTML = `
                <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm flex justify-between items-center">
                    <div>
                        <h1 class="font-bold text-lg text-slate-800">Panel de Administración</h1>
                        <p class="text-xs text-slate-500">${user.email} ${user.email === ADMIN_VIP_EMAIL ? '(Admin VIP)' : '(Suscripción Activa)'}</p>
                    </div>
                    <button onclick="logout()" class="text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-lg text-sm font-medium transition">Cerrar Sesión</button>
                </header>

                <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">
                    ${!store ? `
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <h2 class="text-xl font-bold mb-2">Paso Final: Configura los datos de tu tienda</h2>
                            <p class="text-sm text-slate-600 mb-6">Establece el nombre y número de contacto para que tus clientes te hagan pedidos por WhatsApp.</p>
                            <form onsubmit="saveStoreConfig(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre de la Tienda</label>
                                    <input type="text" id="store-name" required class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Descripción corta</label>
                                    <input type="text" id="store-desc" class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Número de WhatsApp (con código de país, ej: 18095555555)</label>
                                    <input type="text" id="store-whatsapp" required class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm">
                                </div>
                                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition">Crear mi Tienda y Ver Enlace</button>
                            </form>
                        </div>
                    ` : `
                        <div class="bg-indigo-50 border border-indigo-100 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <span class="bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-full font-semibold uppercase">Tienda Publicada</span>
                                <h2 class="text-2xl font-bold text-slate-900 mt-2">${store.name}</h2>
                                <p class="text-sm text-slate-600 mt-1">Este es el enlace único de tu tienda (compártelo con tus clientes):</p>
                                <a href="?store=${encodeURIComponent(store.slug || store.name)}" target="_blank" class="text-indigo-600 font-bold text-sm underline break-all mt-1 inline-block">${window.location.origin}${window.location.pathname}?store=${encodeURIComponent(store.slug || store.name)}</a>
                            </div>
                        </div>

                        <!-- Formulario de Añadir Producto -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-lg mb-4">Añadir Nuevo Producto al Catálogo</h3>
                            <form onsubmit="addProduct(event, '${store.id}')" class="space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre del Producto</label>
                                        <input type="text" id="prod-name" required class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Precio (RD$)</label>
                                        <input type="number" id="prod-price" required class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm">
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Stock disponible</label>
                                        <input type="number" id="prod-stock" class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Descuento % (Opcional)</label>
                                        <input type="number" id="prod-discount" placeholder="Ej: 15" class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Foto del producto</label>
                                        <input type="file" id="prod-file" accept="image/*" class="w-full text-xs text-slate-500 file:py-2 file:px-3 file:rounded-xl file:border-0 file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Descripción detallada</label>
                                    <textarea id="prod-desc" class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm h-20"></textarea>
                                </div>
                                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition shadow-sm">Agregar Producto al Catálogo</button>
                            </form>
                        </div>

                        <!-- Lista de Productos en el Panel -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-lg mb-4">Tus Productos Actuales</h3>
                            <div class="space-y-3">
                                ${db.products.filter(p => p.storeId === store.id).length === 0 ? '<p class="text-sm text-slate-500">Aún no hay productos en tu catálogo.</p>' : ''}
                                ${db.products.filter(p => p.storeId === store.id).map(p => `
                                    <div class="flex items-center justify-between p-3 border border-slate-100 rounded-xl bg-slate-50">
                                        <div class="flex items-center gap-3">
                                            <img src="${p.image}" class="w-12 h-12 object-cover rounded-lg">
                                            <div>
                                                <h4 class="font-bold text-sm text-slate-900">${p.name}</h4>
                                                <p class="text-xs text-indigo-600 font-semibold">RD$ ${p.price} ${p.stock ? `• Stock: ${p.stock}` : ''}</p>
                                            </div>
                                        </div>
                                        <button onclick="deleteProduct('${p.id}')" class="text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg text-sm font-medium transition">Eliminar</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `}
                </main>
            `;
        }

        // --- FUNCIONES DE ACCIÓN ---
        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            setSession({ email });
            router();
        }

        function simulatePayPalSuccess() {
            const user = getSession();
            if (user) {
                const db = getDB();
                db.subscriptions[user.email] = true;
                saveDB(db);
            }
        }

        function confirmPaymentManual() {
            simulatePayPalSuccess();
            router();
        }

        function logout() {
            localStorage.removeItem('saas_current_user');
            router();
        }

        function saveStoreConfig(event) {
            event.preventDefault();
            const user = getSession();
            const db = getDB();

            const name = document.getElementById('store-name').value.trim();
            const description = document.getElementById('store-desc').value.trim();
            const whatsapp = document.getElementById('store-whatsapp').value.trim();
            const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '');

            const newStore = {
                id: 'store_' + Date.now(),
                ownerEmail: user.email,
                name,
                description,
                whatsapp,
                slug
            };

            db.stores.push(newStore);
            saveDB(db);
            router();
        }

        function addProduct(event, storeId) {
            event.preventDefault();
            const db = getDB();
            const name = document.getElementById('prod-name').value.trim();
            const price = document.getElementById('prod-price').value.trim();
            const stock = document.getElementById('prod-stock').value.trim();
            const discount = document.getElementById('prod-discount').value.trim();
            const description = document.getElementById('prod-desc').value.trim();
            const fileInput = document.getElementById('prod-file');

            const saveProductData = (imageUrl) => {
                const newProduct = {
                    id: 'prod_' + Date.now(),
                    storeId,
                    name,
                    price,
                    stock,
                    discount,
                    description,
                    image: imageUrl || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'
                };
                db.products.push(newProduct);
                saveDB(db);
                router();
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveProductData(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveProductData('');
            }
        }

        function deleteProduct(productId) {
            const db = getDB();
            db.products = db.products.filter(p => p.id !== productId);
            saveDB(db);
            router();
        }

        function filterProducts(storeId) {
            const query = document.getElementById('search-input').value.toLowerCase();
            const db = getDB();
            const products = db.products.filter(p => p.storeId === storeId && p.name.toLowerCase().includes(query));
            const grid = document.getElementById('products-grid');

            if (!grid) return;

            grid.innerHTML = products.length === 0 ? '<p class="col-span-full text-center text-slate-500 py-12">No se encontraron productos.</p>' : 
                products.map(p => `
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                        <div class="h-48 bg-slate-100 overflow-hidden cursor-pointer relative" onclick="openProductModal('${p.id}')">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                            ${p.discount ? `<span class="absolute top-3 right-3 bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full">${p.discount}% OFF</span>` : ''}
                        </div>
                        <div class="p-4 flex flex-col flex-grow">
                            <h3 class="font-bold text-lg text-slate-900 cursor-pointer hover:text-indigo-600" onclick="openProductModal('${p.id}')">${p.name}</h3>
                            <p class="text-slate-600 text-sm mt-1 line-clamp-2 flex-grow">${p.description || 'Sin descripción'}</p>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-xl font-extrabold text-indigo-600">RD$ ${p.price}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
        }

        function openProductModal(productId) {
            const db = getDB();
            const p = db.products.find(item => item.id === productId);
            if (!p) return;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <img src="${p.image}" class="w-full h-64 object-cover rounded-xl mb-4">
                <h3 class="text-2xl font-bold text-slate-900">${p.name}</h3>
                <p class="text-xl font-extrabold text-indigo-600 mt-2">RD$ ${p.price}</p>
                <p class="text-sm text-slate-600 mt-4">${p.description || 'Sin descripción detallada.'}</p>
                ${p.stock ? `<p class="text-xs text-slate-500 mt-2">Stock disponible: ${p.stock}</p>` : ''}
            `;
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function sendAdminSuggestion(event) {
            event.preventDefault();
            const name = document.getElementById('sug-name').value;
            const msg = document.getElementById('sug-msg').value;
            window.location.href = `mailto:${ADMIN_VIP_EMAIL}?subject=Sugerencia%20SaaS%20de%20${encodeURIComponent(name)}&body=${encodeURIComponent(msg)}`;
        }

        window.addEventListener('DOMContentLoaded', router);
    </script>
</body>
</html>
